[common]
api_mode=true
api_access_token=@@ADMIN_TOKEN@@
enable_insert=false
default_external_config=config/custom/custom.ini
base_path=config/custom
clash_rule_base=config/custom/clash-base.yaml
proxy_config=NONE
proxy_ruleset=NONE
proxy_subscription=NONE
reload_conf_on_request=false

[node_pref]
clash_use_new_field_name=true
append_sub_userinfo=true
sort_flag=false

[emojis]
add_emoji=true
remove_old_emoji=true
rule=!!import:snippets/emoji.txt

[rulesets]
enabled=true
overwrite_original_rules=true

[server]
listen=0.0.0.0
port=25500
serve_file_root=

[advanced]
log_level=warn
print_debug_info=false
enable_cache=true
cache_subscription=60
cache_config=300
cache_ruleset=3600
async_fetch_ruleset=true
skip_failed_links=false
