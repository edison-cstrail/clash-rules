[custom]
enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=config/custom/clash-base.yaml

; Order matters: the first matching rule wins.
; Personal rules override every community rule below.
ruleset=REJECT,rules/custom/reject.list
ruleset=DIRECT,rules/custom/direct.list
ruleset=Proxy,rules/custom/proxy.list

; Community rules are fetched from the upstream branch, not copied into this repo.
; Local networks, Apple, proxy domains, Chinese domains/IPs, then the default policy.
ruleset=DIRECT,rules/custom/lan.list
ruleset=Apple,clash-classic:https://raw.githubusercontent.com/dler-io/Rules/main/Clash/Provider/Apple.yaml
ruleset=Proxy,clash-classic:https://raw.githubusercontent.com/dler-io/Rules/main/Clash/Provider/Proxy.yaml
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/dler-io/Rules/main/Clash/Provider/Domestic.yaml
ruleset=DIRECT,[]GEOIP,CN
ruleset=Final,[]FINAL

custom_proxy_group=Proxy`select`[]Auto`.*
custom_proxy_group=Auto`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=Apple`select`[]DIRECT`[]Proxy
custom_proxy_group=Final`select`[]Proxy`[]DIRECT

; For a Clash rule-provider with payload entries such as DOMAIN-SUFFIX,...:
; ruleset=Apple,clash-classic:https://your-domain.example/rules/apple.yaml
; That URL is a ruleset reference here, not a replacement for this whole file.
; Alternative domain-only source (use clash-domain, not clash-classic):
; ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
