name: Sync ACL4SSR

on:
  schedule:
    # 10:17 Asia/Shanghai
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync.yml
      - scripts/sync_acl4ssr.py
      - tests/**
      - rules/**

permissions:
  contents: read

concurrency:
  group: sync-acl4ssr
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Test config generation
        run: python3 -B -m unittest discover -s tests -v

      - name: Sync complete community config
        run: python3 -B scripts/sync_acl4ssr.py

      - name: Commit changed config
        shell: bash
        run: |
          if git diff --quiet -- config/github.ini; then
            echo "Community config unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- config/github.ini
          git commit -m 'Sync ACL4SSR community config'
          git push origin HEAD:main
